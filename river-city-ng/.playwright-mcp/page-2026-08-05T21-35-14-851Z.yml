    - generic [ref=f1e31]:
      - heading "RIVER CITY SYNDICATE" [level=1] [ref=f1e32]
      - paragraph [ref=f1e33]: Dad bods and rock gods can be one and the same. Fueled by riffs, nostalgia, and just enough ibuprofen, we bring the noise - because earplugs are for the weak.
      - generic [ref=f1e34]: Upcoming Shows
    - generic [ref=f1e40]:
      - img "Elle Christine" [ref=f1e43]
      - generic [ref=f1e46]:
        - heading "About River City Syndicate" [level=2] [ref=f1e47]
        - paragraph [ref=f1e48]: River City Syndicate is a fun-loving rock band based out of Richmond, Virginia, made up of middle-aged men who still remember when gas was cheap and rock was loud. They tear through crowd-pleasing covers of all your favorite hits—mostly from back when knees didn’t crack—while sneaking in a few original songs for good measure. Equal parts energy and experience, they’ll get you up and dancing, or at least enthusiastically nodding along while reminiscing about “the good old days.” Whether it’s a packed dance floor or a well-earned beer break, these guys know how to bring the party.
