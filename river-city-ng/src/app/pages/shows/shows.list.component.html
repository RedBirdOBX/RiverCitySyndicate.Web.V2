<div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
</div>

<div *ngIf="!errorMessage && shows.length === 0">
    Loading shows...
</div>

<section>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="row">

                    <div class="section-heading">
                        <h2>Upcoming Shows</h2>
                    </div>

                    @for (show of shows; track show.id; let i = $index)
                    {
                        <div class="col-lg-12 mb-1-9">
                            <article class="card blog-card">
                                <div class="row g-0">
                                    <div class="col-md-6">
                                        <a [routerLink]="['/shows', show.slug]">
                                            <div class="card-img bg-img cover-background h-100"
                                                style="background-image: url('/assets/imgs/content/gigs/{{show.image}}');">
                                            </div>
                                        </a>
                                    </div>
                                    <div id="show-body" class="col-md-6" [class.bg-light]="i % 2 === 0">
                                        <div class="card-body">
                                            <div class="d-block text-muted mb-2">
                                                <h3>
                                                    <a [routerLink]="['/shows', show.slug]">{{ show.date | date: 'fullDate' }}</a>
                                                </h3>
                                            </div>
                                            <h3><a [routerLink]="['/shows', show.slug]">{{show.title}}</a></h3>
                                            <p>
                                                {{show.location}}<br />
                                                {{show.time}}
                                            </p>

                                            <p>{{show.description}}</p>

                                            <div class="row">
                                                <div class="col-6">
                                                    @if (show?.url)
                                                    {
                                                        <span *ngIf="show?.url">
                                                            <a target="_blank" [href]="show?.url">
                                                                <span class="fa fa-2x fa-globe fa-fw"></span>
                                                                &nbsp;{{ show?.title }}
                                                            </a>
                                                        </span>
                                                    }
                                                </div>
                                                <div class="col-6">
                                                    <a target="_blank" href="{{show.mapUrl}}">
                                                        <span class="fa fa-2x fa-map-marker"></span>&nbsp;map
                                                    </a>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </article>
                        </div>
                    }
                </div>
            </div>
        </div>
    </div>
</section>
